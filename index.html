<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic_tac_toe</title>
    <link href="./style.css" rel="stylesheet" type="text/css">
</head>

<body>

    <h2>Tic tac toe</h2>
    <form action="" method="post" class="names">

        <label for="player1-name">Player 1 name:</label>
        <input type="text" id="player1-name" name="player1Name">

        <label for="player2-name">Player 2 name:</label>
        <input type="text" id="player2-name" name="player2Name">
        <button type="submit">Save names</button>

    </form>

    <h3 class="game-text">Begin game</h3>

    <div class="game">

        <div class="top left">

        </div>
        <div class="top middle">

        </div>
        <div class="top right">

        </div>
        <div class="mid left">

        </div>
        <div class="mid middle">

        </div>
        <div class="mid right">

        </div>
        <div class="bottom left">

        </div>
        <div class="bottom middle">

        </div>
        <div class="bottom right">

        </div>

    </div>
    <button type="button" class="restart">Restart game</button>

</body>

<script src="./script.js"></script>

</html>
